<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ATLAS</title>
    <meta name="description" content="Briefing quotidien d'actualité, décryptages géopolitiques, histoire et quiz." />
    <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ATLAS" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>
      // Applique le thème avant le rendu pour éviter un flash.
      try {
        var s = JSON.parse(localStorage.getItem('atlas:v1') || '{}');
        var t = s.theme || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        if (s.textSize === 'large') document.documentElement.classList.add('text-large');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>ATLAS nécessite JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
