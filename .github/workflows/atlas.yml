name: ATLAS — actualisation et déploiement

on:
  schedule:
    # Toutes les 3 heures (heure UTC). Le briefing du jour est mis à jour à chaque passage.
    - cron: '17 */3 * * *'
  workflow_dispatch: # bouton « Run workflow » = actualisation manuelle
  push:
    branches: [main]

permissions:
  contents: write # pour enregistrer l'historique des données sur la branche « data »
  pages: write
  id-token: write
  models: read # uniquement si les résumés IA facultatifs sont activés (ATLAS_AI)

concurrency:
  group: atlas
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Récupérer l'historique des données (branche data)
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git clone --depth 1 --branch data "$REPO_URL" public/data
          else
            mkdir -p public/data
            cd public/data && git init -b data && git remote add origin "$REPO_URL"
          fi

      - name: Actualiser les données (flux RSS, Wikidata, Banque mondiale)
        # En cas d'échec, les dernières données valides restent publiées.
        continue-on-error: true
        env:
          ATLAS_AI: ${{ vars.ATLAS_AI }} # laisser vide pour désactiver ; « github-models » pour activer
          ATLAS_AI_MODEL: ${{ vars.ATLAS_AI_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run pipeline

      - name: Enregistrer l'historique
        working-directory: public/data
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add -A
          git commit -m "Données du $(date -u +%Y-%m-%dT%H:%MZ)" || echo "Aucun changement"
          git push origin data || echo "Échec de l'enregistrement de l'historique"

      - name: Construire le site
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm run build
          rm -rf dist/data/.git

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
